<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סטים</title>
<style>
/* layout idea: iOS-style app shell. translucent large-title header, content scrolls underneath, translucent tab bar; sets tracker is the hero of every exercise page */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FA; --ink:#1C1C1E; --ink2:#6E6E73; --ink3:#AEAEB2;
  --line:rgba(60,60,67,.12); --accent:#FF5A1F; --accent-ink:#FFFFFF; --accent-soft:rgba(255,90,31,.12);
  --good:#30B14A; --warn:#FFB020; --bad:#E5484D; --blue:#2F6BFF;
  --glass:rgba(242,242,247,.72); --glass-line:rgba(255,255,255,.5);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
  --r:18px; --r2:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Heebo","Noto Sans Hebrew",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --ink2:#A1A1A6; --ink3:#636366;
  --line:rgba(84,84,88,.5); --accent:#FF6A33; --accent-soft:rgba(255,106,51,.18);
  --glass:rgba(0,0,0,.6); --glass-line:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --ink2:#A1A1A6; --ink3:#636366;
  --line:rgba(84,84,88,.5); --accent:#FF6A33; --accent-soft:rgba(255,106,51,.18);
  --glass:rgba(0,0,0,.6); --glass-line:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);font-variant-numeric:tabular-nums;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--blue);text-decoration:none}
img{max-width:100%}
h1,h2,h3{margin:0;text-wrap:balance}
.app{height:100%;display:flex;flex-direction:column;position:relative}

/* header */
.hdr{position:absolute;top:0;inset-inline:0;z-index:20;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--glass-line);display:flex;align-items:center;gap:10px;min-height:52px}
.hdr .ttl{font-weight:700;font-size:17px;letter-spacing:-.01em;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .side{min-width:64px;display:flex;align-items:center;gap:6px}
.hdr .side.end{justify-content:flex-end}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;padding:6px 4px;border-radius:10px}
.back svg{width:12px;height:20px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;overflow:hidden;font-size:14px}
.avatar img{width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-transparency:reduce){.hdr,.tabbar,.sheet{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* scroll area */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top) + 64px) 16px calc(env(safe-area-inset-bottom) + 96px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.big{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:6px 0 14px}
.sub{color:var(--ink2);font-size:15px}
.sec{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:22px 4px 8px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.xs{font-size:12px}
.b{font-weight:600}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pressable{transition:transform 120ms ease-out,opacity 120ms ease-out}
.pressable:active,.pressable.pressed{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.pressable{transition:none}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--card2);color:var(--ink2);font-size:13px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;width:100%}
.btn.sec2{background:var(--card2);color:var(--ink)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;border-radius:11px}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:start}
.tile .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.tile .l{font-size:12px;color:var(--ink2);font-weight:600}
.cat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;align-items:center;gap:12px;text-align:start;width:100%}
.cat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--accent-soft)}
.cat .t{font-weight:700;font-size:16px}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:start;border-bottom:1px solid var(--line);position:relative}
.item:last-child{border-bottom:0}
.item .th{width:56px;height:56px;border-radius:12px;background:var(--card2);flex:none;overflow:hidden;display:grid;place-items:center}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .t{font-weight:600;font-size:15px}
.item .s{font-size:12px;color:var(--ink2)}
.item .r{color:var(--ink3)}
.star{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);font-size:18px;flex:none}
.star.on{color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.search input{border:0;background:none;flex:1;outline:none;font-size:16px}
.empty{text-align:center;color:var(--ink2);padding:30px 16px}
.empty .e{font-size:40px;margin-bottom:6px}
.banner{background:var(--accent-soft);color:var(--accent);border-radius:var(--r2);padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.banner.blue{background:rgba(47,107,255,.12);color:var(--blue)}
.banner.good{background:rgba(48,177,74,.14);color:var(--good)}

/* tab bar */
.tabbar{position:absolute;bottom:0;inset-inline:0;z-index:20;display:flex;justify-content:space-around;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--glass-line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink2);font-size:10px;font-weight:600;padding:4px 10px;border-radius:12px;min-width:56px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}

/* exercise page */
.hero{display:grid;grid-template-columns:1fr 128px;gap:14px;align-items:start;margin-bottom:12px}
.hero .img{width:128px;height:128px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero .img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:opacity 220ms ease}
.hero .img img.hide{opacity:0}
.hero .img .flip{position:absolute;bottom:6px;inset-inline-end:6px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:8px;padding:3px 7px;font-size:11px;font-weight:700}
.hero h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero .en{color:var(--ink2);font-size:14px;margin-top:3px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sets{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 0 10px;margin-bottom:12px}
.sets .hd{display:grid;grid-template-columns:40px 1fr 1fr 48px;gap:8px;padding:8px 14px 6px;font-size:12px;color:var(--ink2);font-weight:600;text-align:center}
.set{display:grid;grid-template-columns:40px 1fr 1fr 48px;gap:8px;align-items:center;padding:6px 14px;border-top:1px solid var(--line)}
.set .no{font-weight:700;color:var(--ink2);text-align:center;font-size:15px}
.set.done .no{color:var(--good)}
.set.done{background:rgba(48,177,74,.06)}
.stp{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;background:var(--card2);border-radius:12px;height:44px;overflow:hidden}
.stp button{height:100%;display:grid;place-items:center;font-size:22px;color:var(--accent);font-weight:500;user-select:none;touch-action:manipulation}
.stp button:active{background:var(--accent-soft)}
.stp input{text-align:center;border:0;background:none;font-weight:700;font-size:18px;width:100%;outline:none;padding:0;min-width:0}
.stp .prev{position:absolute}
.chk{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--ink3);justify-self:center;transition:transform 160ms cubic-bezier(.2,1.4,.4,1),background 160ms}
.chk.on{background:var(--good);color:#fff;transform:scale(1.04)}
.chk svg{width:20px;height:20px}
.cmp{font-size:12px;color:var(--ink2);text-align:center;margin-top:2px;min-height:14px}
.cmp .up{color:var(--good);font-weight:700}
.cmp .dn{color:var(--bad);font-weight:700}
.setact{display:flex;gap:8px;padding:10px 14px 0}
.last{font-size:13px;color:var(--ink2);padding:8px 14px 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chart{width:100%;height:120px;display:block}
.steps{padding-inline-start:20px;margin:6px 0;color:var(--ink);font-size:14px}
.steps li{margin-bottom:6px}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"›";color:var(--ink3);font-size:22px;transform:rotate(90deg);transition:transform 200ms}
details[open] summary::after{transform:rotate(-90deg)}
.yt{display:flex;align-items:center;gap:10px;background:#FF0000;color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;margin-top:10px}
.yt svg{width:24px;height:24px}
.hist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.hist .h{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist .h:last-child{border-bottom:0}
.pr{display:inline-flex;align-items:center;gap:4px;background:rgba(255,176,32,.18);color:#B07400;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:30;opacity:0;pointer-events:none}
.scrim.on{pointer-events:auto}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:31;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.18);max-height:92%;display:flex;flex-direction:column;transform:translateY(110%);will-change:transform;touch-action:none}
.sheet .grab{height:22px;display:grid;place-items:center;flex:none;cursor:grab}
.sheet .grab i{width:38px;height:5px;border-radius:3px;background:var(--ink3);opacity:.6}
.sheet .body{overflow-y:auto;padding:0 18px calc(env(safe-area-inset-bottom) + 20px);touch-action:pan-y}
.sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 12px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:600;color:var(--ink2)}
.fld input,.fld select,.fld textarea{background:var(--card2);border:0;border-radius:12px;padding:12px 14px;font-size:16px;outline:none;width:100%}
.fld textarea{min-height:80px;resize:vertical}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toast{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 92px);inset-inline:0;display:flex;justify-content:center;z-index:40;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity 200ms,transform 200ms}
.toast span.on{opacity:1;transform:none}
.brands{display:grid;grid-template-columns:1fr;gap:10px}
.brand{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;text-align:start;width:100%;display:flex;flex-direction:column;gap:4px;border:2px solid transparent}
.brand.on{border-color:var(--accent)}
.brand .n{font-weight:800;font-size:17px}
.brand .c{font-size:12px;color:var(--ink2)}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:20px;letter-spacing:-.02em}
.pg{display:none}
.pg.on{display:block}
.view-anim{animation:pgin 260ms cubic-bezier(.2,.8,.2,1)}
@keyframes pgin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view-anim{animation:fade 180ms ease}@keyframes fade{from{opacity:0}to{opacity:1}} .chk{transition:none}}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink2)}
.day i{width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;color:var(--ink2)}
.day i.on{background:var(--accent);color:#fff}
.day i.today{outline:2px solid var(--accent);outline-offset:1px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px}
.bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .bar i{width:100%;border-radius:6px 6px 3px 3px;background:var(--accent);opacity:.85;min-height:3px}
.bars .bar.cur i{opacity:1}
.bars .bar span{font-size:10px;color:var(--ink2)}
.thumbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:start;display:flex;flex-direction:column}
.mcard .im{aspect-ratio:1;background:var(--card2);display:grid;place-items:center;overflow:hidden;font-size:34px}
.mcard .im img{width:100%;height:100%;object-fit:cover}
.mcard .tx{padding:10px 12px}
.mcard .tx .t{font-weight:700;font-size:14px;line-height:1.25}
.mcard .tx .s{font-size:11px;color:var(--ink2);margin-top:3px}
.focus-ring:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hide{display:none!important}
.credit{text-align:center;font-size:12px;color:var(--ink3);padding:20px 0 0}
.credit a{color:var(--ink2)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr" id="hdr"></header>
  <main class="scroll" id="scroll"><div id="view"></div></main>
  <nav class="tabbar" id="tabbar"></nav>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog"><div class="grab"><i></i></div><div class="body" id="sheetBody"></div></section>
  <div class="toast" id="toast"><span id="toastTx"></span></div>
</div>

<script>
'use strict';
/* ========================= vocabulary ========================= */
const GROUPS = {chest:'חזה',back:'גב',shoulders:'כתפיים',arms:'ידיים',legs:'רגליים',glutes:'ישבן',core:'בטן וליבה',cardio:'קרדיו',stretch:'מתיחות וגמישות',full:'כל הגוף'};
const GROUP_ICON = {chest:'🫁',back:'🔙',shoulders:'🏋️',arms:'💪',legs:'🦵',glutes:'🍑',core:'🎯',cardio:'❤️',stretch:'🧘',full:'🔥'};

const S = {ex:[],byId:{},db:null,user:null,uid:null,assets:null,sample:null,canWrite:null,
  profile:{name:'',photo:'',goal:'hypertrophy',weekly:3,brand:'',created:0,seed:0},
  deck:{machines:[],stars:[],custom:[]},
  logs:{}, // exId -> {sessions:[{d,sets:[{r,w,t}]}]}
  yt:{}, // exId -> url override
  today:{d:'',plan:[],done:{}},
  loaded:false,storageMode:'local'};
const todayKey = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const writeQ = {};
async function save(key,obj){
  try{ localStorage.setItem('gt:'+key, JSON.stringify(obj)); }catch(e){}
  if(!S.db || !S.uid) return;
  const run = async()=>{ try{ await S.db.collection('data/users/'+S.uid).doc(key).set(obj); }
    catch(e){ if(e && e.code==='invalid_argument'){ S.canWrite=false; renderBanner(); } else if(e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); try{ await S.db.collection('data/users/'+S.uid).doc(key).set(obj);}catch(_){} } } };
  writeQ[key] = (writeQ[key]||Promise.resolve()).then(run);
  return writeQ[key];
}
function loadLocal(){
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!k.startsWith('gt:')) continue; applyDoc(k.slice(3), JSON.parse(localStorage.getItem(k))); } }catch(e){}
}
function applyDoc(key,data){
  if(!data) return;
  if(key==='profile') S.profile={...S.profile,...data};
  else if(key==='deck') S.deck={...S.deck,...data};
  else if(key==='yt') S.yt=data.map||{};
  else if(key.startsWith('log-')) S.logs[key.slice(4)]=data;
  else if(key.startsWith('today-')){ if(key.slice(6)===todayKey()) S.today={...S.today,...data}; }
}
async function initCloud(){
  const t = setTimeout(()=>{ if(!S.loaded){ S.loaded=true; render(); } }, 10000);
  try{
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    S.db=db; S.user=user;
    if(user){ try{ S.uid = await user.id(); }catch(e){} try{ S.canWrite = await user.can('data.write'); }catch(e){} }
    if(db && S.uid){
      S.storageMode='cloud';
      const snap = await db.collection('data/users/'+S.uid).limit(1000).get();
      if(!snap.empty){ Object.keys(S.logs).forEach(k=>delete S.logs[k]); snap.docs.forEach(d=>applyDoc(d.id,d.data())); }
      else { // first cloud visit: push local data up
        const keys=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith('gt:')) keys.push(k.slice(3)); } }catch(e){}
        for(const k of keys){ try{ await save(k, JSON.parse(localStorage.getItem('gt:'+k))); }catch(e){} }
      }
    }
    claude.use('assets').then(a=>{ S.assets=a; }).catch(()=>{});
